name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (Astro + Pagefind)
        run: npm run build
        env:
          # GitHub Pages project-page URL pattern: https://<user>.github.io/<repo>/
          # SITE_URL  = the origin only (e.g. https://caleaf.github.io)
          # BASE_PATH = the project path  (e.g. /travel-notes)
          # When you move to a custom domain set SITE_URL=https://your-domain and BASE_PATH=/
          SITE: ${{ vars.SITE_URL }}
          BASE: ${{ vars.BASE_PATH }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
